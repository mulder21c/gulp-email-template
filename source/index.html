<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Email</title>
  <link rel="stylesheet" href="../tmp/css/index.css">
</head>
<body>
  <div class="font">
    <table>
      <tr>
        <td class="header">
          <table>
            <tr>
              <td class="logo">
                <a href="#" target="_blank">
                  <img src="//www.saraminimage.co.kr/sri/mail/common/mail_208x80_200907.png" width="104" height="40" border="0" style="vertical-align:bottom;" alt="">
                </a>
              </td>
              <td class="date">2025. 03. 31. 금</td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td>
          <div class="msg-box">
            <div class="msg-box__inner">
              <table>
                <tr>
                  <td colspan="2" class="msg-box__header">
                    <span class="msg-box__header--accent">가능한 면접 일정</span>을 선택해주세요.
                  </td>
                </tr>
                <tr>
                  <td colspan="2" class="msg-box__divider">
                    <div class="msg-box__divider--border"></div>
                  </td>
                </tr>
                <tr>
                  <td class="msg-box__key">채용명</td>
                  <td class="msg-box__val"><b>$recruit$</b></td>
                </tr>
                <tr>
                  <td class="msg-box__key">일정명</td>
                  <td class="msg-box__val">$subject$</td>
                </tr>
                <tr>
                  <td class="msg-box__key">답변 기한</td>
                  <td class="msg-box__val">$limit$</td>
                </tr>
                <tr>
                  <td colspan="2" class="msg-box__divider msg-box__divider--bottom">
                    <div class="msg-box__divider--border"></div>
                  </td>
                </tr>
                <tr>
                  <td colspan="2" class="msg-box__content">
                    $content$
                  </td>
                </tr>
                <tr>
                  <td colspan="2" class="msg-box__control">
                    <a href="#" target="_blank">일정 선택</a>
                  </td>
                </tr>
              </table>
            </div>
            <div class="msg-box__footer">
              본 메일은 귀하가 사람인 서비스(사람인, 점핏, KoMate 등)을 통해 이력서 공개 등으로 입사 지원 중이거나, <br>
              사람인 서비스 외에서 기업회원이 절차에 따라 제공받은 귀하의 입사지원 정보가 <br>
              사람인 채용관리서비스에서 관리됨에 따라 발송되었습니다.
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td class="footer">
          <div class="social-links">
            <a
              href="https://www.saramin.co.kr/zf_user/event/attend-promo?utm_source=saramin&amp;utm_medium=mail_footer&amp;utm_campaign=promotion_2023&amp;utm_term=attend-promo"
              name="ANCHOR114066"
              target="_blank"
              class="social-links__item"
            >
              <img src="//www.saraminimage.co.kr/sri/mail/person/icon_saramin.png" alt="사람인"  width="30" height="30">
            </a>
            <a
              href="https://www.instagram.com/saramin_official/"
              name="ANCHOR114067"
              target="_blank"
              class="social-links__item"
            >
              <img src="//www.saraminimage.co.kr/sri/mail/person/icon_insta.png" alt="인스타그램" width="30" height="30">
            </a>
            <a
              href="https://www.facebook.com/saramin.dream"
              name="ANCHOR114068"
              target="_blank"
              class="social-links__item"
            >
              <img src="//www.saraminimage.co.kr/sri/mail/person/icon_facebook.png" alt="페이스북" style="border:0;vertical-align:top;" width="30" height="30">
            </a>
            <a
              href="https://blog.naver.com/saraminapp"
              name="ANCHOR114069"
              target="_blank"
              class="social-links__item"
            >
              <img src="//www.saraminimage.co.kr/sri/mail/person/icon_blog.png" alt="블로그" style="border:0;vertical-align:top;" width="30" height="30">
            </a>
          </div>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
